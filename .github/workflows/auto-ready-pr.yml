name: Auto Ready Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-ready:
    runs-on: ubuntu-latest

    steps:
      - name: Mark Draft PR as Ready for Review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh pr ready "$PR_NUMBER" \
            --repo "$REPO"
