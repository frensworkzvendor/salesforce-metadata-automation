name: Salesforce Auto Merge


on:
  workflow_run:
    workflows:
      - Salesforce PR Validate
    types:
      - completed


permissions:
  contents: write
  pull-requests: write


jobs:

  auto-merge:

    name: auto-merge

    runs-on: ubuntu-latest


    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'


    steps:

      - name: Find Pull Request

        id: pr

        uses: actions/github-script@v7

        with:

          script: |

            let pr = null;


            const prs =
              context.payload.workflow_run.pull_requests;


            if (prs && prs.length > 0) {

              pr = prs[0];

            }


            if (!pr) {

              const headBranch =
                context.payload.workflow_run.head_branch;


              const result =
                await github.rest.pulls.list({

                  owner: context.repo.owner,

                  repo: context.repo.repo,

                  state: 'open',

                  head:
                    `${context.repo.owner}:${headBranch}`

                });


              if (result.data.length > 0) {

                pr = result.data[0];

              }

            }


            if (!pr) {

              core.setFailed(
                'No open pull request found.'
              );

              return;

            }

            const result =
              await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });

            const pullRequest = result.data;


            core.setOutput(
              'number',
              pullRequest.number
            );


            core.setOutput(
              'repo',
              `${context.repo.owner}/${context.repo.repo}`
            );

            core.setOutput(
              'draft',
              String(pullRequest.draft)
            );



      - name: Merge Pull Request

        if: steps.pr.outputs.draft == 'false'

        env:

          GH_TOKEN: ${{ secrets.GH_PAT }}

          PR_NUMBER:
            ${{ steps.pr.outputs.number }}

          REPO:
            ${{ steps.pr.outputs.repo }}


        run: |

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --squash \
            --delete-branch


      - name: Skip Draft Pull Request

        if: steps.pr.outputs.draft == 'true'

        env:

          PR_NUMBER:
            ${{ steps.pr.outputs.number }}


        run: |

          echo "::notice::Pull request #${PR_NUMBER} is still a draft. Auto merge will run after it becomes ready and validation succeeds."
